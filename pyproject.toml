[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-graph-processes"
version = "0.2.0"
description = "Этап «Процессы»: роли, сценарии, выбор для автоматизации, как есть и как будет — с диаграммами"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["idea-graph-core @ git+https://github.com/senia-glitch/idea-graph-core.git"]

[project.optional-dependencies]
test = ["pytest", "idea-graph-engine"]

[project.entry-points."idea_graph.packages"]
processes = "idea_graph_processes:manifest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idea_graph_processes = ["*.md", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
